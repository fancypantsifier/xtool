name: photoframe build

on:
  push:
    branches: [photoframe]

jobs:
  dns-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Diagnostics
        run: |
          set +e
          grep -h -E "^(deb|URIs)" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | head -3
          for n in archive.ubuntu.com azure.archive.ubuntu.com security.ubuntu.com github.com download.swift.org; do
            echo "host $n: $(getent hosts $n | head -1)"
          done
          docker pull -q ubuntu:22.04 >/dev/null
          for net in bridge host; do
            for n in azure.archive.ubuntu.com github.com; do
              echo "container($net) $n: $(docker run --rm --network $net ubuntu:22.04 getent hosts $n | head -1)"
            done
          done

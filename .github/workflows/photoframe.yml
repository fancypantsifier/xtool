name: photoframe build

# Builds the patched xtool AppImage for the photo-frame NAS signer (x86_64 Linux only) and publishes it
# as a release on this fork. Same image and build script as upstream's release.yml, plus a DNS
# workaround because Docker builds on GitHub runners couldn't resolve hostnames (Nov 2026).
on:
  push:
    branches: [photoframe]

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker DNS workaround
        run: |
          # Docker's builder skips the runner's local resolver (127.0.0.53) and falls back to public DNS,
          # which doesn't resolve here; point Docker at the runner's upstream DNS servers instead.
          dns=$(awk '/^nameserver/ {print $2}' /run/systemd/resolve/resolv.conf | grep -v '^127\.' | jq -R . | jq -sc .)
          echo "upstream DNS: $dns"
          (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') | jq --argjson dns "$dns" '. + {dns: $dns}' > /tmp/daemon.json
          sudo cp /tmp/daemon.json /etc/docker/daemon.json && sudo systemctl restart docker
          # Diagnostics: bridge-network containers have no working DNS on these runners; host network does.
          docker run --rm busybox nslookup archive.ubuntu.com || echo "bridge network: DNS failed"
          docker run --rm --network host busybox nslookup archive.ubuntu.com
      - name: Build image
        run: |
          docker buildx build --network host --allow network.host --target dev --load -t xtool-dev .
      - name: Build AppImage
        run: |
          mkdir -p .build/linux
          docker run --rm --network host \
            -e XTOOL_VERSION=1.23.0-photoframe -e XTL_CI=1 \
            -v "$PWD:/xtool" -v "$PWD/.build/linux:/xtool/.build" \
            xtool-dev Linux/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="1.23.0-photoframe-${GITHUB_SHA::7}"
          gh release create "$tag" Linux/packages/xtool-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "xtool $tag" \
            --notes "xtool 1.23.0 plus a fix: skip re-registering devices already on the team (a free team at its device limit returns 403 otherwise; same fix as upstream PR #312). Built by GitHub Actions from $GITHUB_SHA."
